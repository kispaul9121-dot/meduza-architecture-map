<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meduza — карта архитектуры</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
  <h1>MEDUZA — КАРТА АРХИТЕКТУРЫ</h1>
  <nav class="modes" aria-label="Режим карты">
    <button data-mode="architecture" class="active">Архитектура</button>
    <button data-mode="tasks">Задачи</button>
    <button data-mode="all">Всё</button>
  </nav>
</header>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>

  <aside id="details" class="details hidden">
    <button id="closeDetails" class="details-close">×</button>
    <div id="detailsBody"></div>
  </aside>

  <div class="hint">Клик по карточке с ветками — раскрыть/свернуть. Перетаскивание — изменить позицию. Двойной клик — подробности.</div>
  <div class="corner">
    <button id="zoomOut">−</button>
    <button id="reset">◎</button>
    <button id="resetLayout">↺</button>
    <button id="zoomIn">+</button>
  </div>
</div>

<script src="./app.js" defer></script>
</body>
</html>
