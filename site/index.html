<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meduza — карта архитектуры</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090c12;
      color: #e6edf3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background:
      radial-gradient(circle at 50% 50%, rgba(42,70,110,.18), transparent 32%),
      #090c12;
    }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 18px;
      border-bottom: 1px solid #252b36;
      background: rgba(15,19,27,.92);
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: .02em; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px; font-size: 11px; color: #b8c0cc; }
    .legend span { padding: 4px 8px; border: 1px solid #303846; border-radius: 999px; background: #111722; }
    #stage { position: relative; overflow: hidden; min-height: 0; cursor: grab; }
    #stage.dragging { cursor: grabbing; }
    #world { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; transform-origin: 0 0; }
    #edges { position: absolute; overflow: visible; left: 0; top: 0; pointer-events: none; }
    .edge { stroke: #3d4858; stroke-width: 2; fill: none; opacity: .78; }
    .edge.primary { stroke: #60748f; stroke-width: 2.5; }
    .node {
      position: absolute;
      width: 210px;
      transform: translate(-50%, -50%);
      border: 1px solid #313a49;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(27,34,46,.98), rgba(17,22,31,.98));
      box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.025);
      user-select: none;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .node:hover {
      border-color: #56657a;
      box-shadow: 0 13px 34px rgba(0,0,0,.36), 0 0 0 1px rgba(105,132,170,.08);
    }
    .node.expandable { cursor: pointer; }
    .node.root {
      width: 190px;
      border-color: #6e8bb5;
      background: radial-gradient(circle at 50% 28%, rgba(72,104,151,.32), transparent 48%),
                  linear-gradient(180deg, #1c2635, #111722);
      box-shadow: 0 0 44px rgba(72,104,151,.22), 0 12px 36px rgba(0,0,0,.36);
    }
    .node.branch { width: 220px; }
    .node.current { border-color: #d6a84a; box-shadow: 0 0 0 1px rgba(214,168,74,.22), 0 12px 32px rgba(0,0,0,.34); }
    .node.blocked { border-color: #84444d; }
    .node.protected { border-color: #67539b; }
    .node.done { border-color: #3f6f59; }
    .node-head {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 12px 12px 9px;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; margin-top: 5px;
      background: #7b8797; box-shadow: 0 0 0 3px rgba(123,135,151,.09);
    }
    .done .status-dot { background: #62b387; box-shadow: 0 0 0 3px rgba(98,179,135,.10); }
    .current .status-dot { background: #e2b455; box-shadow: 0 0 0 3px rgba(226,180,85,.11); }
    .blocked .status-dot { background: #cf6571; box-shadow: 0 0 0 3px rgba(207,101,113,.10); }
    .protected .status-dot { background: #9b82dc; box-shadow: 0 0 0 3px rgba(155,130,220,.10); }
    .node-copy { min-width: 0; flex: 1; }
    .node-title { font-size: 13px; line-height: 1.28; font-weight: 720; color: #eef3f8; }
    .node-sub { margin-top: 4px; font-size: 10.5px; line-height: 1.32; color: #8f9aaa; }
    .toggle {
      flex: 0 0 auto;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid #46546a;
      background: #0e141e;
      color: #dbe5f1;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 650;
      line-height: 1;
      cursor: pointer;
    }
    .toggle:hover { border-color: #7186a4; background: #16202e; }
    .leaf-mark {
      flex: 0 0 auto;
      width: 28px; height: 28px;
      display: grid; place-items: center;
      color: #596577; font-size: 16px;
    }
    .node-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid #252d38;
      padding: 7px 10px;
      min-height: 31px;
      color: #8e9bab;
      font-size: 10px;
    }
    .branch-count {
      padding: 2px 6px;
      border: 1px solid #334052;
      border-radius: 999px;
      background: #101722;
      color: #a8b6c7;
    }
    .leaf-label { color: #657285; }
    .status-label { text-transform: uppercase; letter-spacing: .06em; font-size: 9px; }
    .done .status-label { color: #79c89c; }
    .current .status-label { color: #e8bd67; }
    .blocked .status-label { color: #dc7a85; }
    .protected .status-label { color: #b39be9; }
    .hint {
      position: absolute;
      left: 16px; bottom: 14px;
      z-index: 15;
      max-width: min(580px, calc(100vw - 32px));
      padding: 8px 10px;
      border: 1px solid #303846;
      border-radius: 10px;
      background: rgba(12,16,23,.86);
      color: #8995a5;
      font-size: 11px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .corner {
      position: absolute;
      right: 16px; bottom: 14px; z-index: 15;
      display: flex; gap: 7px;
    }
    .corner button {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1px solid #303846; background: rgba(14,19,28,.9); color: #bec9d7;
      cursor: pointer; font-size: 15px;
    }
    .corner button:hover { border-color: #52647c; }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .legend { display: none; }
      .node { width: 185px; }
      .node.branch { width: 195px; }
      .node.root { width: 170px; }
    }
  </style>
</head>
<body>
<header>
  <h1>MEDUZA — КАРТА АРХИТЕКТУРЫ</h1>
  <div class="legend">
    <span>✅ готово</span><span>🟡 проверка / вы здесь</span><span>⛔ заблокировано</span><span>🛡 защищаемый контракт</span>
  </div>
</header>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
  <div class="hint">Карточка с <b>+</b>/<b>−</b> имеет дочернюю ветку. Карточка без кнопки — конечный узел. Колесо — масштаб, перетаскивание пустого поля — движение карты.</div>
  <div class="corner">
    <button id="zoomOut" title="Уменьшить">−</button>
    <button id="reset" title="Вернуть центр">◎</button>
    <button id="zoomIn" title="Увеличить">+</button>
  </div>
</div>

<script>
const data = {
  id: "meduza", title: "MEDUZA", subtitle: "центр проекта", status: "root", expanded: true,
  children: [
    {
      id: "catalog", title: "Каталог", subtitle: "структура товаров и умные папки", status: "branch", expanded: true,
      children: [
        { id: "r502", title: "R5-02 — пагинация", subtitle: "список / фильтры / count", status: "done" },
        { id: "t14", title: "TASK-14 — технический scope", subtitle: "иерархия и колонки", status: "done" },
        {
          id: "t16", title: "TASK-16 — умные папки", subtitle: "семантическая принадлежность", status: "current", expanded: true,
          children: [
            { id: "t17", title: "TASK-17 — Guided Move", subtitle: "после приёмки TASK-16", status: "blocked" },
            { id: "t15", title: "TASK-15 — производительность", subtitle: "параллельная проверка", status: "branch" }
          ]
        }
      ]
    },
    {
      id: "characteristics", title: "Характеристики", subtitle: "группы, свойства и факты", status: "branch", expanded: false,
      children: [
        { id: "facts", title: "Facts / Properties", subtitle: "канонические характеристики", status: "branch" },
        { id: "groups", title: "Группы характеристик", subtitle: "без виртуальной «Без группы»", status: "done" }
      ]
    },
    {
      id: "config", title: "Комплектация", subtitle: "узлы и конфигуратор", status: "branch", expanded: false,
      children: [
        { id: "cpu", title: "CPU", subtitle: "Processor / socket / min-max", status: "branch" },
        { id: "ram", title: "RAM", subtitle: "DIMM / ограничения", status: "branch" },
        { id: "storage", title: "Storage", subtitle: "SFF / LFF / NVMe", status: "branch" },
        { id: "pci", title: "PCI", subtitle: "slots / x8 / x16", status: "branch" }
      ]
    },
    {
      id: "storefront", title: "Страница / Витрина", subtitle: "как товар выглядит пользователю", status: "branch", expanded: false,
      children: [
        { id: "page", title: "Страница товара", subtitle: "контент и представление", status: "branch" },
        { id: "guided", title: "Guided configurator", subtitle: "пользовательский путь", status: "branch" }
      ]
    },
    {
      id: "seo", title: "SEO", subtitle: "поисковая структура и метаданные", status: "branch", expanded: false,
      children: [
        { id: "seo-meta", title: "Metadata", subtitle: "title / description / canonical", status: "branch" },
        { id: "seo-routes", title: "Routes", subtitle: "URL и индексируемые страницы", status: "branch" }
      ]
    },
    {
      id: "contracts", title: "Контракты", subtitle: "то, что нельзя ломать", status: "protected", expanded: true,
      children: [
        { id: "r503", title: "R5-03 — MatchSpec / Refresh", subtitle: "сохранённый MatchSpec и Refresh", status: "protected" },
        { id: "catalogColumns", title: "catalog:columns:v1", subtitle: "защищаемый контракт колонок", status: "protected" }
      ]
    },
    {
      id: "pilot", title: "Пилот", subtitle: "контрольные модели", status: "branch", expanded: false,
      children: [
        { id: "r750", title: "Dell R750", subtitle: "контрольная точка каталога", status: "branch" }
      ]
    }
  ]
};

const stage = document.getElementById("stage");
const world = document.getElementById("world");
const nodesLayer = document.getElementById("nodes");
const svg = document.getElementById("edges");

let panX = 0, panY = 0, scale = 0.88;
let drag = null;

function allVisible() {
  const items = [];
  function walk(node, depth, parent, rootIndex, rootCount, branchAngle, span) {
    items.push({node, depth, parent, rootIndex, rootCount, branchAngle, span});
    if (!node.children || !node.expanded) return;
    const kids = node.children;
    kids.forEach((child, i) => {
      let childAngle = branchAngle;
      let childSpan = span;
      if (depth === 0) {
        childAngle = -90 + (360 / kids.length) * i;
        childSpan = Math.min(52, 300 / kids.length);
      } else if (kids.length > 1) {
        const start = branchAngle - span / 2;
        childAngle = start + (span / (kids.length - 1)) * i;
        childSpan = Math.max(13, span * 0.55);
      }
      walk(child, depth + 1, node, depth === 0 ? i : rootIndex, depth === 0 ? kids.length : rootCount, childAngle, childSpan);
    });
  }
  walk(data, 0, null, 0, 1, 0, 0);
  return items;
}

function polar(r, deg) {
  const a = deg * Math.PI / 180;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r };
}

function layoutItems(items) {
  const map = new Map();
  items.forEach((item) => {
    if (item.depth === 0) {
      map.set(item.node.id, {x:0,y:0});
      return;
    }
    const step = item.depth === 1 ? 300 : 245;
    const r = 130 + item.depth * step;
    const p = polar(r, item.branchAngle);
    map.set(item.node.id, p);
  });
  return map;
}

function classFor(node) {
  if (node.id === "meduza") return "node root";
  let c = "node";
  if (node.children && node.children.length) c += " expandable";
  if (node.status === "done") c += " done";
  else if (node.status === "current") c += " current";
  else if (node.status === "blocked") c += " blocked";
  else if (node.status === "protected") c += " protected";
  else c += " branch";
  return c;
}

function statusText(node) {
  if (node.id === "meduza") return "центр";
  if (node.status === "done") return "готово";
  if (node.status === "current") return "вы здесь";
  if (node.status === "blocked") return "заблокировано";
  if (node.status === "protected") return "контракт";
  return "раздел";
}

function render() {
  const items = allVisible();
  const pos = layoutItems(items);
  nodesLayer.innerHTML = "";
  svg.innerHTML = "";

  items.forEach((item) => {
    if (item.parent) {
      const a = pos.get(item.parent.id);
      const b = pos.get(item.node.id);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", a.x);
      line.setAttribute("y1", a.y);
      line.setAttribute("x2", b.x);
      line.setAttribute("y2", b.y);
      line.setAttribute("class", item.depth === 1 ? "edge primary" : "edge");
      svg.appendChild(line);
    }
  });

  items.forEach((item) => {
    const node = item.node;
    const p = pos.get(node.id);
    const el = document.createElement("div");
    el.className = classFor(node);
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.dataset.id = node.id;

    const hasChildren = !!(node.children && node.children.length);
    const branchInfo = hasChildren
      ? '<span class="branch-count">' + node.children.length + ' ' + (node.children.length === 1 ? 'ветка' : 'ветки') + '</span>'
      : '<span class="leaf-label">конечный узел</span>';
    const control = hasChildren
      ? '<button class="toggle" title="' + (node.expanded ? 'Свернуть ветку' : 'Раскрыть ветку') + '">' + (node.expanded ? '−' : '+') + '</button>'
      : '<span class="leaf-mark" title="Нет дочерних веток">•</span>';

    el.innerHTML =
      '<div class="node-head">' +
        '<span class="status-dot"></span>' +
        '<div class="node-copy"><div class="node-title">' + node.title + '</div><div class="node-sub">' + (node.subtitle || '') + '</div></div>' +
        control +
      '</div>' +
      '<div class="node-foot"><span class="status-label">' + statusText(node) + '</span>' + branchInfo + '</div>';

    if (hasChildren) {
      el.addEventListener("click", (e) => {
        if (e.target.closest(".toggle") || e.target === el || e.target.closest(".node-head") || e.target.closest(".node-foot")) {
          node.expanded = !node.expanded;
          render();
        }
      });
    }
    nodesLayer.appendChild(el);
  });

  applyTransform();
}

function applyTransform() {
  world.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
}

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const before = scale;
  scale = Math.max(0.34, Math.min(1.55, scale * (e.deltaY > 0 ? 0.91 : 1.10)));
  if (Math.abs(before - scale) > 0.001) applyTransform();
}, {passive:false});

stage.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node") || e.target.closest("button")) return;
  drag = {x:e.clientX, y:e.clientY, panX, panY};
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  panX = drag.panX + (e.clientX - drag.x) / scale;
  panY = drag.panY + (e.clientY - drag.y) / scale;
  applyTransform();
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });

document.getElementById("zoomIn").onclick = () => { scale = Math.min(1.55, scale * 1.12); applyTransform(); };
document.getElementById("zoomOut").onclick = () => { scale = Math.max(0.34, scale / 1.12); applyTransform(); };
document.getElementById("reset").onclick = () => { panX = 0; panY = 0; scale = 0.88; applyTransform(); };

render();
</script>
</body>
</html>
